
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightbox Rohrbach</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 21px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tile {
    background: #243746;
    border: 1px solid #496579;
    border-radius: 10px;
    min-height: 105px;
    padding: 12px 5px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .label {
    font-size: 13px;
    color: #b5cad9;
    margin-bottom: 10px;
  }
  .value {
    font-size: 25px;
    font-weight: bold;
    overflow-wrap: break-word;
  }
  #updated {
    text-align: center;
    color: #b5cad9;
    margin-top: 12px;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>FLIGHTBOX ROHRBACH</h1>

<div class="grid">
  <div class="tile">
    <div class="label">FLUGNUMMER</div>
    <div class="value" id="flug">–</div>
  </div>
  <div class="tile">
    <div class="label">FLUGZEUGTYP</div>
    <div class="value" id="typ">–</div>
  </div>
  <div class="tile">
    <div class="label">FLUGHÖHE</div>
    <div class="value" id="hoehe">–</div>
  </div>
  <div class="tile">
    <div class="label">ENTFERNUNG</div>
    <div class="value" id="entfernung">–</div>
  </div>
  <div class="tile">
    <div class="label">GESCHWINDIGKEIT</div>
    <div class="value" id="tempo">–</div>
  </div>
  <div class="tile">
    <div class="label">STATUS</div>
    <div class="value" id="status">–</div>
  </div>
</div>

<div id="updated">Lade Flugzeugdaten ...</div>

<script>
function anzeigen(id, wert) {
  document.getElementById(id).textContent = wert;
}

function zahl(wert, einheit) {
  if (wert === null || wert === undefined || wert === "") {
    return "–";
  }
  var n = Number(wert);
  if (isNaN(n)) return "–";
  return Math.round(n).toLocaleString("de-DE") + " " + einheit;
}

function laden() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "flights.json?t=" + new Date().getTime(), true);

  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;

    if (xhr.status !== 200) {
      anzeigen("updated", "Datenabruf fehlgeschlagen");
      return;
    }

    try {
      var daten = JSON.parse(xhr.responseText);
      var flugzeuge = daten.flugzeuge || [];

      flugzeuge.sort(function(a, b) {
        return Number(a.entfernung_km) - Number(b.entfernung_km);
      });

      if (flugzeuge.length === 0) {
        anzeigen("flug", "Kein Flugzeug");
        anzeigen("typ", "–");
        anzeigen("hoehe", "–");
        anzeigen("entfernung", "–");
        anzeigen("tempo", "–");
        anzeigen("status", "–");
      } else {
        var f = flugzeuge[0];

        anzeigen("flug", f.flug || "Unbekannt");
        anzeigen("typ", f.typ || "Unbekannt");
        anzeigen("hoehe", zahl(f.hoehe_m, "m"));
        anzeigen("entfernung", zahl(f.entfernung_km, "km"));
        anzeigen("tempo", zahl(f.geschwindigkeit_kmh, "km/h"));
        anzeigen("status", f.status || "Unbekannt");
      }

      anzeigen("updated", "Letzte Datenaktualisierung: " +
        (daten.aktualisiert || "Unbekannt"));

    } catch (e) {
      anzeigen("updated", "Fehler beim Lesen der Daten");
    }
  };

  xhr.send();
}

laden();
setInterval(laden, 60000);
</script>

</body>
</html>
