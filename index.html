
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Flight Box</title>
<style>
body {
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 15px;
}
h1 { color: #ffcc00; font-size: 28px; }
.label { color: #aaaaaa; font-size: 18px; margin-top: 20px; }
.value { font-size: 34px; font-weight: bold; margin-top: 5px; }
.note { color: #ffcc00; font-size: 15px; margin-top: 35px; }
</style>
</head>
<body>
<h1>FLIGHT BOX</h1>
<div class="label">Flugnummer</div>
<div class="value">LH1234</div>
<div class="label">Flugzeugtyp</div>
<div class="value">Airbus A320</div>
<div class="label">Flughoehe</div>
<div class="value">10.500 m</div>
<div class="label">Entfernung</div>
<div class="value">25 km</div>
<div class="note">TESTANZEIGE - Keine Live-Daten</div>
</body>
</html>
