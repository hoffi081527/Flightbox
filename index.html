
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightbox Rohrbach</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tile {
    background: #243746;
    border: 1px solid #496579;
    border-radius: 10px;
    min-height: 150px;
    padding: 12px 5px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .label {
    font-size: 20px;
    color: #b5cad9;
    margin-bottom: 10px;
  }
  .value {
    font-size: 34px;
    font-weight: bold;
    overflow-wrap: break-word;
  }
  .airport {
    font-size: 27px;
  }
  #updated {
    text-align: center;
    color: #b5cad9;
    margin-top: 12px;
    font-size: 13px;
  }
</style>
</head>
<body>
<h1>FLIGHTBOX ROHRBACH</h1>

<div class="grid">
  <div class="tile">
    <div class="label">FLUGNUMMER</div>
<div class="value" id="flug">–</div>
<div id="airline" style="font-size:20px; margin-top:8px; color:#aaa;">–</div>
  </div>
  <div class="tile">
    <div class="label">FLUGZEUGTYP</div>
    <div class="value" id="typ">–</div>
  </div>
  <div class="tile">
    <div class="label">FLUGHÖHE</div>
    <div class="value" id="hoehe">–</div>
  </div>
  <div class="tile">
    <div class="label">ENTFERNUNG</div>
    <div class="value" id="entfernung">–</div>
  </div>
  <div class="tile">
    <div class="label">GESCHWINDIGKEIT</div>
    <div class="value" id="tempo">–</div>
  </div>
  <div class="tile">
    <div class="label">STATUS</div>
    <div class="value" id="status">–</div>
  </div>
  <div class="tile">
    <div class="label">ABFLUGORT</div>
    <div class="value airport" id="start">–</div>
  </div>
  <div class="tile">
    <div class="label">ZIELFLUGHAFEN</div>
    <div class="value airport" id="ziel">–</div>
  </div>
</div>

<div id="updated">Lade Flugzeugdaten ...</div>

<script>
function anzeigen(id, wert) {
  document.getElementById(id).textContent = wert;
}

function zahl(wert, einheit) {
  if (wert === null || wert === undefined || wert === "") {
    return "–";
  }
  var n = Number(wert);
  if (isNaN(n)) return "–";
  return Math.round(n).toLocaleString("de-DE") + " " + einheit;
}

function ort(wert) {
  if (!wert || wert === "Unbekannt") {
    return "Unbekannt";
  }
  return String(wert);
}

function laden() {
  var xhr = new XMLHttpRequest();
 
xhr.open("GET", "https://flightbox-rohrbach.hoffi081527.workers.dev/?t=" + new Date().getTime(), true);



xhr.onreadystatechange = function() {
  if (xhr.readyState !== 4) return;
  if (xhr.status !== 200) {
    anzeigen("updated", "Datenabruf fehlgeschlagen");
    return;
  }

  try {
    var daten = JSON.parse(xhr.responseText);
    var flugzeuge = daten.ac || [];

    flugzeuge.sort(function(a, b) {
      return Number(a.dst || 9999) - Number(b.dst || 9999);
    });

    if (flugzeuge.length === 0) {
      anzeigen("flug", "Kein Flugzeug");
     
anzeigen("airline", "–");

      anzeigen("typ", "–");
      anzeigen("hoehe", "–");
      anzeigen("entfernung", "–");
      anzeigen("tempo", "–");
      anzeigen("status", "–");
      anzeigen("start", "–");
      anzeigen("ziel", "–");
    } else {
      var f = flugzeuge[0];

      anzeigen("flug", (f.flight || "Unbekannt").trim());
     
var rufzeichen = (f.flight || "").trim().toUpperCase();
var airlines = {
  "DLH": "Lufthansa",
  "CFG": "Condor",
  "EWG": "Eurowings",
  "RYR": "Ryanair",
  "EZY": "easyJet",
  "EJU": "easyJet Europe",
  "SWR": "SWISS",
  "AUA": "Austrian Airlines",
  "THY": "Turkish Airlines",
  "KLM": "KLM",
  "AFR": "Air France",
  "BAW": "British Airways",
  "UAE": "Emirates",
  "QTR": "Qatar Airways",
  "SIA": "Singapore Airlines",
  "UAL": "United Airlines",
  "DAL": "Delta Air Lines"
};
anzeigen("airline", airlines[rufzeichen.substring(0, 3)] || "Unbekannte Airline");

      anzeigen("typ", f.t || "Unbekannt");

      anzeigen("hoehe",
        f.alt_baro != null && typeof f.alt_baro === "number"
          ? Math.round(f.alt_baro * 0.3048) + " m"
          : "Unbekannt");

      anzeigen("entfernung",
        f.dst != null
          ? (f.dst * 1.852).toFixed(1) + " km"
          : "Unbekannt");

      anzeigen("tempo",
        f.gs != null
          ? Math.round(f.gs * 1.852) + " km/h"
          : "Unbekannt");

      var rate = f.baro_rate;
      var status = "Unbekannt";

      if (typeof rate === "number") {
        if (rate > 100) status = "Steigt";
        else if (rate < -100) status = "Sinkt";
        else status = "Horizontalflug";
      }

      anzeigen("status", status);
      anzeigen("start", "Unbekannt");
      anzeigen("ziel", "Unbekannt");
    }

    anzeigen("updated",
      "Letzte Datenaktualisierung: " +
      new Date(daten.now || Date.now()).toLocaleTimeString("de-DE")
    );

  } catch (e) {
    anzeigen("updated", "Fehler beim Lesen der Daten");
  }
};
xhr.send();

}

laden();
setInterval(laden, 30000);
</script>
</body>
</html>
