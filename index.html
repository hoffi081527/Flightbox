<!DOCTYPE html>
<html lang="de">
<head>
 
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101820">
<link rel="apple-touch-icon" href="icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flightbox Rohrbach</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(20px, 3vw, 36px);
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .tile {
    background: #243746;
    border: 1px solid #496579;
    border-radius: 10px;
    min-height: clamp(100px, 25vh, 280px);
    min-width: 0;
    padding: 12px 5px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .label {
    font-size: clamp(11px, 2vw, 24px);
    color: #b5cad9;
    margin-bottom: 10px;
  }

  .value {
    font-size: clamp(18px, 3.5vw, 48px);
    font-weight: bold;
    overflow-wrap: break-word;
  }

  .airport {
    font-size: clamp(15px, 2.8vw, 36px);
  }

  #airline, #typname {
    font-size: clamp(12px, 2vw, 24px);
    margin-top: 8px;
    color: #aaa;
  }

  #foto {
    width: 100%;
    max-height: 19vh;
    object-fit: contain;
    border-radius: 6px;
  }

  #fotograf {
    font-size: 10px;
    color: #b5cad9;
    margin-top: 4px;
  }

  #foto_hinweis {
    font-size: 16px;
    color: #b5cad9;
  }

  #updated {
    text-align: center;
    color: #b5cad9;
    margin-top: 12px;
    font-size: 13px;
  }

  @media (max-width: 600px) and (orientation: portrait) {
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .photo-tile {
      grid-column: span 2;
    }

    #foto {
      max-height: 30vh;
    }
  }
  #miniRadar {width:100%;height:clamp(65px,17vh,190px);display:block;}
  #radarTile {cursor:pointer;color:white;font-family:inherit;}
  #radarTile .label {margin-bottom:2px;}
  #radarOverlay {position:fixed;inset:0;z-index:1000;background:#101820;padding:10px;display:none;flex-direction:column;align-items:center;}
  #radarOverlay.open {display:flex;}
  #radarBar {display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;flex-wrap:wrap;}
  #radarBar button,#radarBar select {background:#243746;color:white;border:1px solid #496579;border-radius:6px;padding:8px;font-size:16px;}
  #bigRadar {width:100%;flex:1;min-height:0;}
  #radarMessage {font-size:14px;text-align:center;padding:4px;}
  #radarInfo {font-size:clamp(20px,3.5vw,34px);font-weight:bold;line-height:1.35;text-align:center;padding:8px;width:100%;overflow-wrap:break-word;}
</style>
</head>

<body>

<h1>FLIGHTBOX ROHRBACH</h1>

<div class="grid">

  <div class="tile">
    <div class="label">FLUGNUMMER</div>
    <div class="value" id="flug">–</div>
    <div id="airline">–</div>
  </div>

  <div class="tile">
    <div class="label">FLUGZEUGTYP</div>
    <div class="value" id="typ">–</div>
    <div id="typname"></div>
  </div>

  <div class="tile">
    <div class="label">FLUGHÖHE</div>
    <div class="value" id="hoehe">–</div>
  </div>

  <div class="tile">
    <div class="label">ENTFERNUNG</div>
    <div class="value" id="entfernung">–</div>
  </div>

  <div class="tile">
    <div class="label">GESCHWINDIGKEIT</div>
    <div class="value" id="tempo">–</div>
  </div>

  <button type="button" class="tile" id="radarTile" aria-label="Großen Radar öffnen">
    <div class="label">RADAR</div>
    <svg id="miniRadar" viewBox="0 0 240 240" aria-label="Position des angezeigten Flugzeugs"></svg>
  </button>

  <div class="tile">
    <div class="label">ABFLUGORT</div>
    <div class="value airport" id="start">–</div>
  </div>

  <div class="tile">
    <div class="label">ZIELFLUGHAFEN</div>
    <div class="value airport" id="ziel">–</div>
  </div>

  <div class="tile photo-tile">
    <div class="label">FLUGZEUGFOTO</div>

    <a id="foto_link"
       target="_blank"
       rel="noopener noreferrer">

      <img id="foto"
           alt="Flugzeugfoto"
           style="display:none;">

    </a>

    <div id="foto_hinweis">
      Kein Foto verfügbar
    </div>

    <div id="fotograf"></div>
  </div>

</div>

<div id="updated">Lade Flugzeugdaten ...</div>

<div id="radarOverlay" role="dialog" aria-label="Flugradar">
  <div id="radarBar"><strong>FLUGRADAR ROHRBACH</strong>
    <label>Radius <select id="radarRange"><option>20</option><option selected>50</option><option>100</option><option>200</option></select> km</label>
    <button id="radarClose" type="button" aria-label="Schließen">✕</button>
  </div>
  <div id="radarMessage"></div>
  <svg id="bigRadar" viewBox="0 0 600 600"></svg>
  <div id="radarInfo">Flugzeug antippen für Details</div>
</div>

// Flugzeugfoto anzeigen

function fotoAnzeigen(f) {

  var bild = document.getElementById("foto");
  var link = document.getElementById("foto_link");
  var hinweis = document.getElementById("foto_hinweis");

  function keinFoto() {
    bild.style.display = "none";
    bild.removeAttribute("src");
    link.removeAttribute("href");
    hinweis.style.display = "block";
    hinweis.textContent = "Kein Foto verfügbar";
    anzeigen("fotograf", "");
  }

  if (!f || !f.foto ||
      !f.foto.startsWith("https://")) {
    keinFoto();
    return;
  }

  bild.onload = function() {
    bild.style.display = "block";
    hinweis.style.display = "none";
  };

  bild.onerror = function() {
    keinFoto();
  };

  if (f.foto_link &&
      f.foto_link.startsWith("https://")) {
    link.href = f.foto_link;
  } else {
    link.removeAttribute("href");
  }

  anzeigen(
    "fotograf",
    f.fotograf
      ? "© " + f.fotograf + " / Planespotters.net"
      : "Planespotters.net"
  );

  if (bild.getAttribute("src") !== f.foto) {
    bild.style.display = "none";
    hinweis.style.display = "block";
    hinweis.textContent = "Lade Flugzeugfoto ...";
    bild.src = f.foto;
  } else if (bild.complete && bild.naturalWidth > 0) {
    bild.style.display = "block";
    hinweis.style.display = "none";
  }
}


// Anzeige ohne Flugzeug

function keinFlugzeug() {
  anzeigen("flug", "Kein Flugzeug");
  anzeigen("airline", "–");
  anzeigen("typ", "–");
  anzeigen("typname", "");
  anzeigen("hoehe", "–");
  anzeigen("entfernung", "–");
  anzeigen("tempo", "–");
  radarZeichnen("miniRadar", [], 27.78);
  anzeigen("start", "–");
  anzeigen("ziel", "–");

  fotoAnzeigen(null);
}


// Flugdaten laden

var laedt = false;

function laden() {

  if (laedt) return;
  laedt = true;

  var xhr = new XMLHttpRequest();

  xhr.open(
    "GET",
    "https://flightbox-rohrbach.hoffi081527.workers.dev/?t="
    + new Date().getTime(),
    true
  );

  xhr.timeout = 25000;

  xhr.onreadystatechange = function() {

    if (xhr.readyState !== 4) return;

    laedt = false;

    if (xhr.status !== 200) {
      anzeigen(
        "updated",
        "Datenabruf fehlgeschlagen – letzter Stand"
      );
      return;
    }

    try {

      var daten = JSON.parse(xhr.responseText);
      var flugzeuge = daten.ac || [];

      flugzeuge.sort(function(a, b) {
        return Number(a.dst == null ? 9999 : a.dst)
             - Number(b.dst == null ? 9999 : b.dst);
      });

      if (flugzeuge.length === 0) {

        keinFlugzeug();

      } else {

        var f = flugzeuge[0];

        var rufzeichen = (f.flight || "")
          .trim()
          .toUpperCase();

        anzeigen(
          "flug",
          rufzeichen || "Unbekannt"
        );

        anzeigen(
          "airline",
          airlines[rufzeichen.substring(0, 3)]
          || "Unbekannte Airline"
        );

        var typcode = String(f.t || "").trim().toUpperCase();
        anzeigen("typ", typcode || "Unbekannt");
        anzeigen("typname", Object.prototype.hasOwnProperty.call(flugzeugtypen, typcode) ? flugzeugtypen[typcode] : "");

        anzeigen(
          "hoehe",
          f.alt_baro === "ground"
            ? "Am Boden"
            : typeof f.alt_baro === "number"
              ? Math.round(f.alt_baro * 0.3048) + " m"
              : "Unbekannt"
        );

        anzeigen(
          "entfernung",
          f.dst != null
            ? (f.dst * 1.852).toFixed(1) + " km"
            : "Unbekannt"
        );

        anzeigen(
          "tempo",
          f.gs != null
            ? Math.round(f.gs * 1.852) + " km/h"
            : "Unbekannt"
        );

        radarZeichnen("miniRadar", [f], 27.78);

        anzeigen(
          "start",
          f.startstadt || "Unbekannt"
        );

        anzeigen(
          "ziel",
          f.zielstadt || "Unbekannt"
        );

        fotoAnzeigen(f);

      }

      anzeigen(
        "updated",
        "Letzte Datenaktualisierung: " +
        new Date(daten.now || Date.now())
          .toLocaleTimeString("de-DE")
      );

    } catch (e) {

      anzeigen(
        "updated",
        "Fehler beim Lesen der Daten"
      );

    }

  };

  xhr.ontimeout = function() {
    laedt = false;
    anzeigen("updated", "Zeitüberschreitung beim Datenabruf");
  };

  xhr.onerror = function() {
    laedt = false;
    anzeigen("updated", "Verbindungsfehler");
  };

  xhr.send();

}



var radarOffen = false, radarTimer = null, radarAnfrage = null;
function radarZeichnen(id, flieger, km) {
  var svg = document.getElementById(id), klein = id === "miniRadar";
  var c = klein ? 120 : 300, r = c * 0.82;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  function el(tag, attrs, text, parent) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs).forEach(function(k){n.setAttribute(k, attrs[k]);});
    if (text != null) n.textContent = text;
    (parent || svg).appendChild(n); return n;
  }
  el("circle",{cx:c,cy:c,r:r,fill:"#142b36",stroke:"#79a9a8","stroke-width":2});
  [0.25,0.5,0.75].forEach(function(q){
    el("circle",{cx:c,cy:c,r:r*q,fill:"none",stroke:"#496579"});
    if(!klein) el("text",{x:c+5,y:c-r*q+14,fill:"#b5cad9","font-size":12},(km*q)+" km");
  });
  el("path",{d:"M"+(c-r)+" "+c+" H"+(c+r)+" M"+c+" "+(c-r)+" V"+(c+r),stroke:"#496579",fill:"none"});
  [["N",c,c-r-5],["O",c+r+9,c+5],["S",c,c+r+16],["W",c-r-9,c+5]].forEach(function(v){el("text",{x:v[1],y:v[2],fill:"#b5cad9","font-size":klein?13:16,"text-anchor":"middle"},v[0]);});
  // Optischer Radar-Sweep, unabhängig vom Datenabruf
  var sweep = el("g", {"pointer-events":"none"});
  for (var j=24; j>=1; j--) {
    var angle=-j*1.5*Math.PI/180;
    var next=-(j-1)*1.5*Math.PI/180;
    el("path", {d:"M"+c+" "+c+" L"+(c+r*Math.sin(angle))+" "+(c-r*Math.cos(angle))+" A"+r+" "+r+" 0 0 1 "+(c+r*Math.sin(next))+" "+(c-r*Math.cos(next))+" Z",fill:"#39ff88",opacity:0.22*(25-j)/24},null,sweep);
  }
  el("line",{x1:c,y1:c,x2:c,y2:c-r,stroke:"#39ff88","stroke-width":klein?1.7:2.5,opacity:0.9},null,sweep);
  el("animateTransform",{attributeName:"transform",type:"rotate",from:"0 "+c+" "+c,to:"360 "+c+" "+c,dur:"5s",repeatCount:"indefinite"},null,sweep);
  el("path",{d:"M-9 0 L0 -9 L9 0 L6 0 V8 H-6 V0 Z",fill:"#ffffff",transform:"translate("+c+" "+c+")"});
  var count=0;
  flieger.forEach(function(f){
    if(typeof f.dst!=="number" || typeof f.dir!=="number" || !isFinite(f.dst) || !isFinite(f.dir) || f.dst<0 || f.dst*1.852>km+0.001) return;
    count++;
    var d=f.dst*1.852/km*r, a=f.dir*Math.PI/180;
    var x=c+Math.sin(a)*d, y=c-Math.cos(a)*d;
    var g=el("g",{transform:"translate("+x+" "+y+")",cursor:klein?"inherit":"pointer"});
    var track=typeof f.track==="number"?f.track:(typeof f.true_heading==="number"?f.true_heading:null);
    el("circle",{r:14,fill:"transparent"},null,g);
    if(track===null) el("circle",{r:5,fill:"#f9d65c"},null,g);
    else el("path",{d:"M0 -13 L3 -3 L13 4 L13 7 L3 4 L2 10 L6 13 L6 15 L0 13 L-6 15 L-6 13 L-2 10 L-3 4 L-13 7 L-13 4 L-3 -3 Z",fill:"#f9d65c",transform:"rotate("+track+")"},null,g);
    if(!klein){
      var ruf = (f.flight||"").trim().toUpperCase();
      var name = airlines[ruf.substring(0,3)] || ruf || f.r || f.hex || "Unbekannt";
      var rechts = x < c;
      el("text",{x:rechts?17:-17,y:5,fill:"#ffffff","font-size":11,"font-weight":"normal","text-anchor":rechts?"start":"end",stroke:"#101820","stroke-width":3,"paint-order":"stroke fill","stroke-linejoin":"round"},name,g);
      el("title",{},(f.flight||f.r||f.hex||"Unbekannt").trim(),g);
      g.addEventListener("click",function(){anzeigen("radarInfo",(airlines[(f.flight||"").trim().toUpperCase().substring(0,3)] || "Unbekannte Airline")+" | "+(f.flight||f.r||f.hex||"Unbekannt").trim()+" | "+(f.t||"–")+" | "+(f.dst*1.852).toFixed(1)+" km | "+(typeof f.alt_baro==="number"?Math.round(f.alt_baro*0.3048)+" m":"–")+" | "+(typeof f.gs==="number"?Math.round(f.gs*1.852)+" km/h":"–"));});
    }
  });
  return count;
}
function radarLaden(){
  if(!radarOffen)return;
  if(radarAnfrage) radarAnfrage.abort();
  var km=Number(document.getElementById("radarRange").value);
  var x=new XMLHttpRequest(); radarAnfrage=x;
  x.open("GET","https://flightbox-rohrbach.hoffi081527.workers.dev/?radar="+km+"&t="+Date.now(),true);
  x.timeout=25000;
  x.onload=function(){
    if(!radarOffen||radarAnfrage!==x)return;
    radarAnfrage=null;
    try {if(x.status!==200)throw Error(); var data=JSON.parse(x.responseText); if(!Array.isArray(data.ac))throw Error(); var n=radarZeichnen("bigRadar",data.ac,km); anzeigen("radarMessage",n+" Flugzeuge mit Position · "+new Date(data.now||Date.now()).toLocaleTimeString("de-DE"));}
    catch(e){anzeigen("radarMessage","Radarabruf fehlgeschlagen – letzter Stand");}
  };
  x.onerror=x.ontimeout=function(){if(radarAnfrage===x){radarAnfrage=null;anzeigen("radarMessage","Radarabruf fehlgeschlagen – letzter Stand");}};
  x.send();
}
function radarSchliessen(){radarOffen=false;clearInterval(radarTimer);if(radarAnfrage){radarAnfrage.abort();radarAnfrage=null;}document.getElementById("radarOverlay").className="";document.body.style.overflow="";}
document.getElementById("radarTile").onclick=function(){radarOffen=true;document.getElementById("radarOverlay").className="open";document.body.style.overflow="hidden";radarZeichnen("bigRadar",[],Number(document.getElementById("radarRange").value));anzeigen("radarMessage","Lade Radardaten ...");radarLaden();clearInterval(radarTimer);radarTimer=setInterval(radarLaden,30000);};
document.getElementById("radarClose").onclick=radarSchliessen;
document.getElementById("radarRange").onchange=function(){radarZeichnen("bigRadar",[],Number(this.value));anzeigen("radarInfo","Flugzeug antippen für Details");anzeigen("radarMessage","Lade Radardaten ...");radarLaden();};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&radarOffen)radarSchliessen();});
radarZeichnen("miniRadar",[],27.78);

// Aktualisierung alle 30 Sekunden

laden();
setInterval(laden, 30000);

</script>
