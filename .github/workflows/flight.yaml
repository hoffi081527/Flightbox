
name: Rohrbach Flight Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Flugzeugdaten abrufen
        run: python flights.py

      - name: Flugzeugdaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          if ! git diff --cached --quiet; then
            git commit -m "Flugzeugdaten aktualisieren"
            git push
          fi

